[project]
name = "chamados-ads"
version = "0.1.0"
description = "Criação de API usando Flask"
readme = "README.md"
authors = [
    { name = "Blackoutseeker", email = "pereira.souza@aluno.ufca.edu.br" }
]
requires-python = ">=3.13"
dependencies = [
    "flask>=3.1.3",
]

[project.scripts]
chamados-ads = "chamados_ads:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"
